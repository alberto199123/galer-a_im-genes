<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado (maskable-safe: area central protegida) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Marco de ventana/aluminio -->
  <rect x="128" y="120" width="256" height="272" rx="14" fill="none" stroke="#f59e0b" stroke-width="14"/>
  <!-- Division central vertical (estilo ventana) -->
  <line x1="256" y1="134" x2="256" y2="378" stroke="#f59e0b" stroke-width="10"/>
  <!-- Division central horizontal -->
  <line x1="142" y1="256" x2="370" y2="256" stroke="#f59e0b" stroke-width="10"/>
  <!-- Cristales con gradiente -->
  <rect x="142" y="134" width="100" height="114" rx="3" fill="url(#glass)" opacity="0.7"/>
  <rect x="270" y="134" width="100" height="114" rx="3" fill="url(#glass)" opacity="0.7"/>
  <rect x="142" y="264" width="100" height="114" rx="3" fill="url(#glass)" opacity="0.7"/>
  <rect x="270" y="264" width="100" height="114" rx="3" fill="url(#glass)" opacity="0.7"/>
  <!-- Brillo en el cristal superior izquierdo -->
  <polygon points="148,140 232,140 148,228" fill="#ffffff" opacity="0.25"/>
  <!-- Texto MrGlass abajo -->
  <text x="256" y="438" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="42" font-weight="800" fill="#ffffff" letter-spacing="1">MrGlass</text>
</svg>
